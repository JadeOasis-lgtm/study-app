<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Flashcards</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="flashcards.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
</head>
<body>
  <a href="index.html" class="back-link">← Home</a>
  <h1>Flashcards</h1>

  <div id="deck-select">
    <label for="deck-picker">Deck:</label>
    <select id="deck-picker">
      <option value="">No deck selected</option>
      <option value="__new__">+ Add New Deck</option>
    </select>
  </div>

  <div id="new-deck-row" class="hidden">
    <input type="text" id="new-deck-input" placeholder="Deck name">
    <button type="button" id="new-deck-confirm">Add</button>
  </div>

  <p id="no-deck-message" class="empty-message hidden">Create a deck above to get started.</p>

  <div id="due-count"></div>

  <div id="reverse-toggle-row">
    <input type="checkbox" id="reverse-toggle">
    <label for="reverse-toggle">Start with answer (reverse)</label>
  </div>

  <button id="study-btn" class="primary-btn">Study This Deck</button>

  <div id="add-card-section">
    <h2 id="form-heading">Add a Card</h2>
    <textarea id="card-front-input" placeholder="Front (question)"></textarea>
    <textarea id="card-back-input" placeholder="Back (answer)"></textarea>
    <button id="add-card-btn" class="primary-btn">Add Card</button>
    <button id="cancel-edit-btn" class="secondary-btn hidden">Cancel Edit</button>
</div>

  <div id="card-list"></div>

  <script src="shared.js"></script>
  <script src="flashcards.js"></script>
</body>
</html>
