<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do — Study App</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="todo.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <a href="index.html" class="back-link">← Home</a>
  <h1>To-Do</h1>

  <form id="add-todo-form">
    <input type="text" id="todo-text-input" placeholder="What do you need to do?" required>



    <div class="subject-row">
      <select id="todo-subject-select">
        <option value="">No subject</option>
        <option value="__new__">+ Add New Subject</option>
      </select>
      <button type="button" id="delete-subject-btn">🗑</button>
    </div>
    <div id="new-subject-container" class="hidden">
      <input type="text" id="new-subject-input" placeholder="Subject name">
      <button type="button" id="confirm-new-subject-btn">Add</button>
    </div>
    


    <input type="date" id="todo-due-input">
    <button type="submit">Add</button>
  </form>

  <div id="todo-list"></div>
  <p id="todo-empty-message" class="hidden">Nothing on your list yet.</p>

  <script type="module" src="auth-guard.js"></script>
  <script src="shared.js"></script>
  <script src="todo.js"></script>
</body>
</html>
